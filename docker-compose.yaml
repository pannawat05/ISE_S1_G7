version: "3.8"

services:

  web-app:
    build:
      context: ./magic_ticket
      dockerfile: Dockerfile
    container_name: node_app_container

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      DB_HOST: db-mysql
      DB_USER: root
      DB_PASSWORD: secretpassword
      DB_NAME: mydatabase

    volumes:
      - ./magic_ticket:/app
      - web_app_node_modules:/app/node_modules

    depends_on:
      - db-mysql

    restart: unless-stopped


  db-mysql:
    image: mysql:8.0
    container_name: mysql_container

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: mydatabase

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always


  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin_container

    ports:
      - "8080:80"

    environment:
      PMA_HOST: db-mysql
      PMA_PORT: 3306

    depends_on:
      - db-mysql

    restart: always


  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api_container

    command: npm run dev

    ports:
      - "5001:5001"

    environment:
      NODE_ENV: development
      DB_HOST: db-mysql
      DB_USER: root
      DB_PASSWORD: secretpassword
      DB_NAME: mydatabase

    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

    depends_on:
      - db-mysql

    restart: unless-stopped


volumes:
  mysql_data:
  web_app_node_modules:
  api_node_modules: