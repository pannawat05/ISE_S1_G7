version: "3.8"

services:

 # ==========================================
  # FRONTEND
  # ==========================================
  web-app:
    build:
      context: ./magic_ticket
      dockerfile: Dockerfile

    container_name: node_app_container

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"

      # เพิ่มตัวแปรนี้เพื่อให้ Frontend ยิง API ผ่าน Nginx (Port 443)
      VITE_API_BASE_URL: /api

      DB_HOST: db-mysql
      DB_USER: root
      DB_PASSWORD: secretpassword
      DB_NAME: mydatabase

    volumes:
      - ./magic_ticket:/app
      - web_app_node_modules:/app/node_modules

    depends_on:
      - db-mysql

    restart: unless-stopped

  # ==========================================
  # BACKEND API
  # ==========================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: api

    command: npm run dev

    # เปิดไว้สำหรับ debug
    # ถ้า deploy จริงสามารถเอาออกได้
    ports:
      - "5001:5001"

    environment:
      NODE_ENV: development

      DB_HOST: db-mysql
      DB_USER: root
      DB_PASSWORD: secretpassword
      DB_NAME: mydatabase

    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

    depends_on:
      - db-mysql

    restart: unless-stopped


  # ==========================================
  # NGINX REVERSE PROXY + HTTPS
  # ==========================================
  nginx:
    image: nginx:alpine

    container_name: nginx_container

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nginx configuration
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # SSL certificates
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - web-app
      - api

    restart: unless-stopped


  # ==========================================
  # MYSQL
  # ==========================================
  db-mysql:
    image: mysql:8.0

    container_name: mysql_container

    ports:
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: mydatabase

    volumes:
      - mysql_data:/var/lib/mysql

    restart: always


  # ==========================================
  # PHPMYADMIN
  # ==========================================
  phpmyadmin:
    image: phpmyadmin:5.2

    container_name: phpmyadmin_container

    ports:
      - "8080:80"

    environment:
      PMA_HOST: db-mysql
      PMA_PORT: 3306

    depends_on:
      - db-mysql

    restart: always


# ==========================================
# VOLUMES
# ==========================================
volumes:
  mysql_data:
  web_app_node_modules:
  api_node_modules:
